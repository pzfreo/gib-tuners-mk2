[project]
name = "gib-tuners"
version = "0.1.1"
description = "Parametric CAD for historic guitar tuner restoration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "build123d>=0.10.0,<0.11",
    "build123d-drafting-helpers>=0.4.2",
    "ocp-vscode>=2.0.0",
    "trimesh[easy]>=4.0.0",
    "networkx>=3.0",
    "xxhash>=3.0",
    "dacite>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
mesh-repair = [
    "pymeshfix>=0.17.0",
    "pyvista>=0.40.0",
]
drawings = [
    "fpdf2>=2.8.7",
    "resvg-py>=0.3.2",
    "pyvista>=0.40.0",
]

[project.scripts]
gib-build = "scripts.build_all:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gib_tuners"]

# Ship the runtime data the package needs (gear configs + reference STEPs) into
# the wheel under gib_tuners/data/. Only the c13-10 production profile and the
# files actually loaded at runtime are included — test artifacts and the archive
# are deliberately excluded to keep the wheel small. See config/defaults.py
# (_resolve_data_dir) for how these are located when installed.
[tool.hatch.build.targets.wheel.force-include]
"config/c13-10/worm_gear.json" = "gib_tuners/data/config/c13-10/worm_gear.json"
"config/c13-10/tuner_config.json" = "gib_tuners/data/config/c13-10/tuner_config.json"
"config/c13-10/geometry_analysis_m0.5.json" = "gib_tuners/data/config/c13-10/geometry_analysis_m0.5.json"
"config/c13-10/wheel_m0.5_z13.step" = "gib_tuners/data/config/c13-10/wheel_m0.5_z13.step"
"config/c13-10/worm_m0.5_z1.step" = "gib_tuners/data/config/c13-10/worm_m0.5_z1.step"
"reference/peghead7mm.step" = "gib_tuners/data/reference/peghead7mm.step"
"reference/worm_m0.5_z1.step" = "gib_tuners/data/reference/worm_m0.5_z1.step"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning:build123d",
    "ignore::DeprecationWarning:ezdxf",
    "ignore::DeprecationWarning:pyparsing",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
    "pillow>=12.2.0",
    "resvg-py>=0.3.2",
]
