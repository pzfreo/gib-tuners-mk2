name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short --gear c13-10

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build assemblies
        run: python scripts/build.py --gear c13-10 --format step --hand both --verbose --num-housings 1

      - name: Upload STEP files
        uses: actions/upload-artifact@v7
        with:
          name: step-files
          path: output/c13-10/
          retention-days: 30

  drawings:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # pyvista renders the shaded pictorials off-screen; headless runners
      # need a virtual display for VTK
      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[drawings]"

      - name: Generate drawing sheets and combined pack
        run: bash scripts/drawings/generate_all.sh

      - name: Upload drawings
        uses: actions/upload-artifact@v7
        with:
          name: drawings
          path: |
            drawings/c13-10/
            drawings/tuner_drawings.pdf
          retention-days: 30
