name: Release

on:
  push:
    tags: ["v*"]

# Needed to create the GitHub Release and upload assets
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # pyvista renders the shaded pictorials off-screen; headless runners
      # need a virtual display for VTK
      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[drawings]"

      - name: Generate drawing pack
        run: bash scripts/drawings/generate_all.sh

      - name: Build production STEP files (both hands, 5-gang)
        run: python scripts/build.py --hand both --gear c13-10 -n 5 --format step --label-frames no

      - name: Package STEP files
        run: |
          cd output && zip -r "../gib-tuners-step-${{ github.ref_name }}.zip" c13-10

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            drawings/tuner_drawings.pdf
            gib-tuners-step-${{ github.ref_name }}.zip
