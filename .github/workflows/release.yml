name: Release

# Push a version tag to cut a release:
#     git tag -a v0.2.1 -m "..." && git push origin v0.2.1
#
# The release is created as a DRAFT so the notes can be edited before it goes
# public.  Publish with:
#     gh release edit v0.2.1 --draft=false
#
# workflow_dispatch runs the same build but stops short of touching the
# release — use it to dry-run the asset pack from a branch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GEAR: c13-10

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short --gear c13-10

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Production build — see production.md.  --label-frames no keeps the RH
      # and LH frames identical in size, which is what the CNC shop expects.
      - name: Build production geometry
        run: |
          python scripts/build.py \
            --hand both \
            --gear "$GEAR" \
            -n 5 \
            --label-frames no \
            --format both \
            --verbose

      # build.py swallows export errors and always exits 0, and the validator
      # only SKIPs a component whose file is missing — so assert the geometry
      # exists before drawing any conclusion from the checks below.
      - name: Assert expected geometry
        run: |
          missing=0
          for f in frame_rh_5gang frame_lh_5gang string_post \
                   peg_head_rh peg_head_lh wheel_rh wheel_lh \
                   assembly_5gang_rh assembly_5gang_lh; do
            for ext in step stl; do
              # assemblies are STEP-only
              case "$f:$ext" in assembly_*:stl) continue ;; esac
              path="output/$GEAR/$f.$ext"
              if [ ! -s "$path" ]; then
                echo "::error::missing or empty: $path"
                missing=1
              fi
            done
          done
          [ -s "output/$GEAR/assembly_5gang.glb" ] || {
            echo "::error::missing or empty: output/$GEAR/assembly_5gang.glb"; missing=1; }
          exit $missing

      # Confirms the build carries exactly the expected changes against the
      # sent/ptype baseline (mounting holes, string hole, pip stalk, volumes).
      # --strict so a WARN — notably the LH/RH size mismatch that catches a
      # labelled-frame build — fails the release instead of shipping.
      - name: Validate against production baseline
        run: python scripts/check_production.py --new "output/$GEAR" --strict

      - name: Upload geometry
        uses: actions/upload-artifact@v7
        with:
          name: geometry
          path: output/${{ env.GEAR }}/
          retention-days: 30

  drawings:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # pyvista renders the shaded pictorials off-screen; headless runners
      # need a virtual display for VTK
      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[drawings]"

      - name: Generate drawing sheets
        run: |
          python scripts/frame_drawing.py
          python scripts/string_post_drawing.py
          python scripts/peg_head_drawing.py
          python scripts/wheel_drawing.py
          python scripts/assembly_drawing.py

      - name: Assemble combined pack
        run: python scripts/drawings/make_pdf.py

      # DXF/SVG are the editable sources behind the PDF sheets; they ship as
      # one archive rather than 10 loose files.
      - name: Zip DXF/SVG sources
        run: |
          cd "drawings/$GEAR"
          zip -j ../../drawings_dxf_svg.zip *.dxf *.svg

      - name: Upload drawings
        uses: actions/upload-artifact@v7
        with:
          name: drawings
          path: |
            drawings/${{ env.GEAR }}/*.pdf
            drawings/tuner_drawings.pdf
            drawings_dxf_svg.zip
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: [build, drawings]
    # Tag pushes only — workflow_dispatch can also be aimed at a tag ref,
    # and a dry run must never create a release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v6

      - name: Download geometry
        uses: actions/download-artifact@v8
        with:
          name: geometry
          path: assets/

      - name: Download drawings
        uses: actions/download-artifact@v8
        with:
          name: drawings
          path: drawings-artifact/

      - name: Collect assets
        run: |
          # download-artifact preserves the upload paths, so flatten the
          # drawings into the same directory as the geometry.
          find drawings-artifact -type f \( -name '*.pdf' -o -name '*.zip' \) \
            -exec mv {} assets/ \;
          ls -la assets/

      # The tag is the release's identity; a mismatched pyproject version is
      # worth flagging but not worth failing a tagged build over.
      - name: Check version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$proj" ]; then
            echo "::warning::tag $GITHUB_REF_NAME does not match pyproject version $proj"
          fi

      # Boilerplate prose lives in .github/release-notes.md so it can be
      # edited without touching the workflow; --generate-notes appends the
      # commit/PR list from the previous tag.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME — $GEAR production pack" \
            --notes "$(cat .github/release-notes.md)" \
            --generate-notes \
            assets/*
